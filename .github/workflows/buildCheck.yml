name: CI - Astro Build Check (para Dev)

on:
  # Se ejecuta cuando se crea una pull request
  pull_request:
    branches: [ "dev" ]
    
  # Se ejecuta cuando se hace push o merge
  push:
    branches: [ "dev" ]

  # Permite ejecución manual
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clona el repositorio
        uses: actions/checkout@v4

      - name: Configura Node.js (v20.x)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm' 

      - name: Instala dependencias limpias
        run: npm ci

      - name: Compila el sitio Astro
        run: npm run build